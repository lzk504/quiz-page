name = "quiz-page"
main = "src/index.ts"
compatibility_date = "2026-10-08"

# Cloudflare 构建：安装依赖后执行；wrangler deploy 时 esbuild 自动编译 src/*.ts
[build]
command = "npm run build"

# 静态资产由平台直接服务（vite 构建产物在 ./dist）；仅 /api/* 走 Worker
# 开启 HIDE_WEB_VAULT 时必须把 run_worker_first 改为 true（否则非 /api 请求不进 Worker）
# html_handling 用默认值（/ 解析到 index.html）；not_found_handling=none 保证未知路径 404
[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "none"

# D1：用户 / 凭证 / 邀请码 / 刷题数据（schema 首次请求自动初始化，无需手动上传 SQL）
# 绑定不在此处写 database_id，改由 Cloudflare Dashboard 注入：
#   Dashboard → Workers & Pages → quiz-page → Settings → Bindings → D1 database，变量名填 DB
#   （本地开发：wrangler dev 会用 --local 的临时 D1，无需真实 id）
# 若希望 wrangler deploy 自动创建/绑定，可自行加回 database_id = "<32 位 hex>"
[[d1_databases]]
binding = "DB"
database_name = "quiz-page-db"

# 迁移期：旧 KV 命名空间作为「KV→D1 读穿迁移」的数据源（可复用账号里已存在的 quiz-page-kv）
# 绑定同样由 Dashboard 注入，变量名 KV——不写 id，避免 wrangler 自动创建同名 namespace 触发 code:10014
#   Dashboard → quiz-page → Settings → Bindings → KV namespace，变量名填 KV，选已有 quiz-page-kv
[[kv_namespaces]]
binding = "KV"

[vars]
# "1" 时隐藏 Web 前端（非 /api 路径返回 404，需配合 run_worker_first = true）
HIDE_WEB_VAULT = "0"
# "1" 时启用 POST /__dev/reset（清库调试用；生产保持 "0"）
ALLOW_DEV_RESET = "0"

# JWT_SECRET 用 secret 注入（不写入此文件）：
#   npx wrangler secret put JWT_SECRET     # 30+ 字符随机串

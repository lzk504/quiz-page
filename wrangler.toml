name = "quiz-page"
main = "worker/index.js"
compatibility_date = "2026-10-08"

# 静态资产由平台直接服务；仅 /api/* 走 Worker（不计入静态资源的 Worker 调用）
# 需要 Wrangler ≥ 4.20。旧环境改为 run_worker_first = true 并在 Worker 内对非 /api 路径 return env.ASSETS.fetch(request)
[assets]
directory = "."
binding = "ASSETS"
run_worker_first = ["/api/*"]
html_handling = "none"
not_found_handling = "none"

# Cloudflare Workers KV：用户表 / 凭证 / 邀请码 / 每用户刷题数据
# 部署前先运行：npx wrangler kv namespace create KV   （把返回的 id 填到下方）
[[kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
preview_id = "REPLACE_WITH_PREVIEW_KV_ID"

# JWT_SECRET 用 secret 注入（不写入此文件）：
#   npx wrangler secret put JWT_SECRET     # 30+ 字符随机串

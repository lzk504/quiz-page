name = "quiz-page"
main = "src/index.ts"
compatibility_date = "2026-10-08"

[build]
command = "npm run build"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "none"

# KV 回退模式：不使用 D1。部署命令 `npm run deploy:kv`
# KV 命名空间通过 Cloudflare Dashboard → 该 Worker → Settings → Bindings 绑定，变量名 "KV"
[[kv_namespaces]]
binding = "KV"

[vars]
HIDE_WEB_VAULT = "0"
ALLOW_DEV_RESET = "0"

# JWT_SECRET 用 secret 注入：npx wrangler secret put JWT_SECRET     # 30+ 字符随机串
